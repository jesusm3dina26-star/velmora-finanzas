Toma el control absoluto de tu dinero con una aplicación moderna, elegante y completamente libre de conexión a internet. Con Velmora puedes registrar tus ingresos, monitorear cada gasto diario, establecer presupuestos mensuales por categoría y cumplir tus metas de ahorro con barras de progreso interactivas.

Características principales:
• 100% OFFLINE: Funciona sin Wi-Fi ni datos móviles. Tus finanzas están siempre disponibles.
• MÁXIMA PRIVACIDAD: Todos tus datos se almacenan exclusivamente en tu teléfono. Cero servidores, cero publicidad intrusiva.
• SALDO INTELIGENTE: Saldo calculado en tiempo real (Ingresos - Gastos - Aportes a Metas de Ahorro).
• METAS DE AHORRO: Define objetivos (vehículo, viajes, emergencias, estudios) y añade aportes con cálculo de porcentaje y fecha estimada.
• PRESUPUESTOS MENSUALES: Fija límites por categorías (Alimentación, Vivienda, Transporte, etc.) y recibe alertas visuales antes de superarlos.
• ESTADÍSTICAS PROFESIONALES: Gráficas de barras semanales (últimas 8 semanas), mensuales (últimos 6 meses) y anuales con comparativa de variación porcentual.
• RESPALDOS LOCALES: Exporta e importa copias de seguridad en formato JSON cuando cambies de teléfono.
